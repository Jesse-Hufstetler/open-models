<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Models</title>
<style>
  :root { --bg:#fff; --fg:#111; --mute:#6b7280; --grid:#d4d4d8; --head:#ececee; --gutter:#f4f4f5; --accent:#2563eb; --size:234,88,12; --pop:37,99,235; --new:22,163,74; --cost:147,51,234; --score:13,148,136; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e6e6e6; --mute:#9aa0a6; --grid:#33373d; --head:#23262b; --gutter:#1d2025; --accent:#6ea8fe; --size:251,146,60; --pop:96,165,250; --new:74,222,128; --cost:192,132,252; --score:45,212,191; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:12px/1.15 "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; }
  .wrap { flex:1; overflow:auto; }
  table { border-collapse:separate; border-spacing:0; }
  th, td { padding:1px 5px; border-right:1px solid var(--grid); border-bottom:1px solid var(--grid); white-space:nowrap; font-variant-numeric:tabular-nums; }
  td.n { text-align:right; }
  th { position:sticky; top:0; z-index:2; background:var(--head); font-weight:600; text-align:left; cursor:pointer; user-select:none; border-top:1px solid var(--grid); }
  th.n { text-align:right; }
  th.sorted { color:var(--accent); }
  td.link { padding:0; cursor:pointer; }
  td.link a { display:block; padding:1px 5px; color:inherit; text-decoration:none; }
  td.link:hover { box-shadow:inset 0 0 0 100px rgba(0,0,0,.10); }
  @media (prefers-color-scheme: dark) { td.link:hover { box-shadow:inset 0 0 0 100px rgba(255,255,255,.14); } }
  #tip { position:fixed; z-index:10; max-width:340px; padding:6px 8px; background:#111; color:#eee; border:1px solid #555; border-radius:3px; font-size:12px; line-height:1.3; white-space:pre-line; pointer-events:none; box-shadow:0 3px 10px rgba(0,0,0,.4); display:none; }
  .mute { color:var(--mute); }
  .status { padding:2px 8px; background:var(--head); border-top:1px solid var(--grid); color:var(--mute); font-size:11px; display:flex; flex-wrap:wrap; gap:0 14px; align-items:center; }
  .status label { color:var(--fg); cursor:pointer; white-space:nowrap; }
  .status input { margin:0 4px 0 0; vertical-align:-2px; }
</style>
</head>
<body>
<div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<div id="tip"></div>
<div class="status">
  <label><input type="checkbox" id="f-scored" checked>Hide models with no scores</label>
  <label><input type="checkbox" id="f-recent" checked>Hide models older than 16 months</label>
  <span id="status">Loading…</span>
</div>

<script>
const num = (d) => v => v == null ? '' : v.toFixed(d);
const clamp01 = t => Math.min(1, Math.max(0, t));
const log = (lo, hi) => v => clamp01((Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)));
const NOW = Date.now();
const SCORE_KEYS = ['aa_intel', 'aa_coding', 'aa_agentic', 'epoch_eci', 'epoch_gpqa', 'epoch_swe'];
const hasScore = m => SCORE_KEYS.some(k => m[k] != null);
const cutoff = (() => { const d = new Date(NOW); d.setMonth(d.getMonth() - 16); return d.toISOString().slice(0, 10); })();
const recent = v => clamp01(1 - (NOW - Date.parse(v)) / (365 * 864e5)); // today = 1, a year ago = 0
const COLS = [
  { k:'country',   label:'Country', tip:"Country of the lab that released the model.\nClick to sort." },
  { k:'org',       label:'Org', tip:"Organization that released the weights (Hugging Face author)." },
  { k:'product',   label:'Product', tip:"Model family, parsed from the Hugging Face model name.\nClick a cell to open the model page on Hugging Face." },
  { k:'version',   label:'Ver', hue:'new', scale:(v, m) => m.ver_t, tip:"Version number parsed from the name.\nShading: newest version in its family is strongest, then the previous two fainter." },
  { k:'variant',   label:'Variant', tip:"Everything else in the name: size tag, Instruct, Base, Thinking, Coder, etc." },
  { k:'composite', label:'Score',      n:1, hue:'score', scale:v => clamp01((v - 15) / 80), fmt:num(0), tip:"Composite of all available intelligence scores.\nEach score (Intel, Coding, Agentic, ECI, GPQA, SWE-V) is turned into a percentile rank among all models that have it, then the ranks are averaged over whichever scores a model has. 0-100; 50 = typical scored model.\nModels with only one score are less reliable. Sort by this column for a quick overall ranking." },
  { k:'aa_intel',  label:'Intel',      n:1, hue:'score', scale:v => clamp01((v - 5) / 60), fmt:num(0), tip:"Artificial Analysis Intelligence Index.\nComposite of many evals, roughly 0-70 for current models. Higher is better.\nOnly models Artificial Analysis lists and we could match by name." },
  { k:'aa_coding', label:'Coding',     n:1, hue:'score', scale:v => clamp01((v - 5) / 60), fmt:num(0), tip:"Artificial Analysis Coding Index.\nComposite of coding evals (e.g. Terminal-Bench, SciCode). Higher is better." },
  { k:'aa_agentic',label:'Agentic',    n:1, hue:'score', scale:v => clamp01((v - 5) / 60), fmt:num(0), tip:"Artificial Analysis Agentic Index.\nComposite of agentic tool-use evals. Higher is better." },
  { k:'epoch_eci', label:'ECI',        n:1, hue:'score', scale:v => clamp01((v - 110) / 55), fmt:num(0), tip:"Epoch Capabilities Index (Epoch AI).\nOne number combining many benchmarks onto a common scale; ~110-165 here. Higher is better." },
  { k:'epoch_gpqa',label:'GPQA',       n:1, hue:'score', scale:v => clamp01((v - 30) / 65), fmt:num(0), tip:"GPQA Diamond accuracy, % (Epoch AI runs).\nGraduate-level science multiple choice; random guessing is 25%." },
  { k:'epoch_swe', label:'SWE-V',      n:1, hue:'score', scale:v => clamp01((v - 20) / 70), fmt:num(0), tip:"SWE-bench Verified, % solved (Epoch AI runs).\nA test of real-world software engineering: the model gets an actual bug report from a popular open-source Python project and must edit the code to fix it. A fix counts only if the project's own tests then pass. 'Verified' = 500 tasks that humans checked are solvable.\nScores depend a lot on the agent scaffold around the model, so compare with care." },
  { k:'params_b',  label:'Params B',   n:1, hue:'size', scale:log(0.1, 1000), fmt:v => v < 10 ? v.toFixed(2) : v.toFixed(1), tip:"Total parameters, in billions.\nFrom Hugging Face safetensors metadata, or the size in the model name.\nFor MoE models this is all experts, which is what must fit in memory." },
  { k:'active_b',  label:'Active B',   n:1, hue:'size', scale:log(0.1, 1000), fmt:v => v == null ? '' : v, tip:"MoE only: parameters active per token, in billions.\nParsed from names like A3B. Blank = dense or not stated in the name.\nSets speed, not memory." },
  { k:'fp16',      label:'FP16 GB',    n:1, hue:'size', scale:log(0.1, 1000), fmt:num(1), tip:"Memory for weights at 16 bits: params x 2 bytes.\nExcludes KV cache and runtime overhead; add 10-30%+." },
  { k:'q8',        label:'Q8 GB',      n:1, hue:'size', scale:log(0.1, 1000), fmt:num(1), tip:"Memory for weights at 8 bits: params x 1 byte.\nExcludes KV cache and runtime overhead." },
  { k:'q4',        label:'Q4 GB',      n:1, hue:'size', scale:log(0.1, 1000), fmt:num(1), tip:"Memory for weights at ~4.5 bits (typical Q4 GGUF): params x ~0.57 bytes.\nExcludes KV cache and runtime overhead." },
  { k:'context',   label:'Context',    n:1, hue:'size', scale:log(4096, 1048576), fmt:v => v == null ? '' : (v >= 1024 ? Math.round(v / 1024) + 'K' : v), tip:"Maximum context window in tokens, from OpenRouter.\nBlank = not listed there. KV cache for long contexts adds a lot of memory." },
  { k:'downloads', label:'Downloads',  n:1, hue:'pop', scale:log(1e3, 3e7), fmt:v => v.toLocaleString(), tip:"Hugging Face downloads over the last 30 days.\nColor is log-scaled." },
  { k:'likes',     label:'Likes',      n:1, hue:'pop', scale:log(10, 5000), fmt:v => v.toLocaleString(), tip:"Hugging Face likes (all time)." },
  { k:'created',   label:'Created',    hue:'new', scale:recent, tip:"Date the repo was created on Hugging Face.\nGreener = more recent (fades to none over a year)." },
  { k:'updated',   label:'Updated',    hue:'new', scale:recent, tip:"Date of the last commit to the repo on Hugging Face.\nGreener = more recent." },
];
const DEFAULT_SORT = [['composite',-1],['country',1],['org',1],['product',1],['version',-1],['params_b',-1]];
const tint = (c, pct) => c ? `background:color-mix(in srgb, ${c} ${pct}%, transparent)` : '';
// Boring values (low t) get no color; only the high end gets noticeable.
const heat = (hue, t) => t < 0.12 ? '' : `background:rgba(var(--${hue}), ${(0.05 + 0.5 * t * t).toFixed(2)})`;

// Rank each version within its own org + product line (and letter prefix, so DeepSeek V and R series don't compete).
function addVersionRank(list) {
  const parse = v => { const m = String(v).match(/^([a-z]?)(\d+(?:\.\d+)*)$/i); return m && { p:m[1].toLowerCase(), n:m[2].split('.').map(Number) }; };
  const diff = (a, b) => { for (let i = 0; i < Math.max(a.length, b.length); i++) { const d = (a[i] || 0) - (b[i] || 0); if (d) return d; } return 0; };
  const groups = {};
  for (const m of list) {
    const p = m.version && parse(m.version);
    if (!p) continue;
    (groups[m.org + '|' + m.product + '|' + p.p] ||= new Map()).set(m.version, p.n);
  }
  for (const g of Object.keys(groups)) {
    const order = [...groups[g].entries()].sort((a, b) => diff(b[1], a[1])).map(e => e[0]);
    groups[g] = order;
  }
  const T = [1, 0.5, 0.25];
  for (const m of list) {
    const p = m.version && parse(m.version);
    m.ver_t = p ? (T[groups[m.org + '|' + m.product + '|' + p.p].indexOf(m.version)] || 0) : 0;
  }
}

let info = '', models = [], orgs = {}, countries = {}, sort = [['composite', -1]];
const $ = id => document.getElementById(id);

// Percentile rank per score column across all models, averaged over the scores a model has.
function addComposite(list) {
  const ranks = SCORE_KEYS.map(k => {
    const vals = list.map(m => m[k]).filter(v => v != null).sort((a, b) => a - b);
    return v => { let lo = 0, hi = vals.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (vals[mid] < v) lo = mid + 1; else hi = mid; } let e = lo; while (e < vals.length && vals[e] === v) e++; return 100 * ((lo + e) / 2) / vals.length; };
  });
  for (const m of list) {
    const r = SCORE_KEYS.map((k, i) => m[k] != null ? ranks[i](m[k]) : null).filter(x => x != null);
    m.composite = r.length ? r.reduce((a, b) => a + b, 0) / r.length : null;
  }
}

function cmp(a, b, k, dir) {
  const x = a[k], y = b[k];
  if (x == null || x === '') return y == null || y === '' ? 0 : 1;
  if (y == null || y === '') return -1;
  const r = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), undefined, { numeric:true, sensitivity:'base' });
  return r * dir;
}

function render() {
  const keys = [...sort, ...DEFAULT_SORT];
  const hideUnscored = $('f-scored').checked, hideOld = $('f-recent').checked;
  const rows = models.filter(m => (!hideUnscored || hasScore(m)) && (!hideOld || !m.created || m.created >= cutoff)).sort((a, b) => {
    for (const [k, d] of keys) { const r = cmp(a, b, k, d); if (r) return r; }
    return 0;
  });
  $('status').textContent = `${rows.length} of ${models.length} models · ${info}`;
  const sk = sort[0] && sort[0][0], sd = sort[0] && sort[0][1];
  $('head').innerHTML = COLS.map(c =>
    `<th data-k="${c.k}" class="${c.n ? 'n' : ''} ${c.k === sk ? 'sorted' : ''}" data-tip="${(c.tip || '').replace(/"/g, '&quot;')}">${c.label}${c.k === sk ? (sd > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');
  $('body').innerHTML = rows.map(m => '<tr>' + COLS.map(c => {
    const v = m[c.k];
    let style = '', html;
    if (c.k === 'country') { style = tint(countries[m.country]?.color, 16); html = `<span data-tip="${countries[m.country]?.name || ''}">${m.country}</span>`; }
    else if (c.k === 'org') { style = tint(orgs[m.org], 16); html = m.org; }
    else if (c.k === 'product') { style = tint(orgs[m.org], 16); html = `<a href="https://huggingface.co/${m.id}" target="_blank" rel="noopener">${m.product}</a>`; }
    else { html = c.fmt ? (v == null ? '' : c.fmt(v)) : (v ?? ''); if (c.hue && v != null && v !== '') style = heat(c.hue, c.scale(v, m)); }
    return `<td class="${c.n ? 'n' : ''}${c.k === 'product' ? ' link' : ''}" style="${style}">${html}</td>`;
  }).join('') + '</tr>').join('');
  document.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    const first = COLS.find(c => c.k === k).n ? -1 : 1;
    sort = [[k, sk === k ? -sd : first]];
    render();
  });
}

const tipEl = $('tip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (!t || !t.dataset.tip) { tipEl.style.display = 'none'; return; }
  tipEl.textContent = t.dataset.tip;
  tipEl.style.display = 'block';
  const r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(4, Math.min(r.left, innerWidth - w - 4)) + 'px';
  tipEl.style.top = (r.bottom + h + 6 > innerHeight ? r.top - h - 4 : r.bottom + 4) + 'px';
});
document.addEventListener('mouseleave', () => tipEl.style.display = 'none');

Promise.all([fetch('data/models.json').then(r => r.json()), fetch('data/orgs.json').then(r => r.json())]).then(([d, o]) => {
  countries = o.countries;
  for (const v of Object.values(o.orgs)) orgs[v.org] = v.color;
  models = d.models.map(m => ({ ...m, version: m.version && m.version.replace(/^v(?=\d)/i, ''), fp16: m.params_b * 2, q8: m.params_b, q4: m.params_b * 0.57 }));
  info = `updated ${d.generated.slice(0, 10)} · Hugging Face + OpenRouter · scores: Artificial Analysis (artificialanalysis.ai), Epoch AI (epoch.ai, CC BY) · memory is weights only (add KV cache) · Active B = MoE active params when named in the model ID`;
  ['f-scored', 'f-recent'].forEach(id => $(id).addEventListener('change', render));
  addVersionRank(models);
  addComposite(models);
  render();
}).catch(() => { $('status').textContent = 'Could not load data'; });
</script>
</body>
</html>
