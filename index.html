<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Models</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root { --bg:#fff; --fg:#111; --mute:#6b7280; --grid:#d4d4d8; --head:#ececee; --gutter:#f4f4f5; --accent:#2563eb; --size:234,88,12; --pop:37,99,235; --new:22,163,74; --cost:147,51,234; --score:13,148,136; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e6e6e6; --mute:#9aa0a6; --grid:#33373d; --head:#23262b; --gutter:#1d2025; --accent:#6ea8fe; --size:251,146,60; --pop:96,165,250; --new:74,222,128; --cost:192,132,252; --score:45,212,191; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:12px/1.15 "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; }
  .wrap { flex:1; overflow:auto; }
  table { border-collapse:separate; border-spacing:0; }
  th, td { padding:1px 5px; border-right:1px solid var(--grid); border-bottom:1px solid var(--grid); white-space:nowrap; font-variant-numeric:tabular-nums; }
  td.n { text-align:right; }
  th { vertical-align:bottom; position:sticky; top:0; z-index:2; background:var(--head); font-weight:600; text-align:left; cursor:pointer; user-select:none; border-top:1px solid var(--grid); border-bottom:4px solid var(--grid); }
  th.n { text-align:right; }
  th.sorted { color:var(--accent); }
  td.link { padding:0; cursor:pointer; }
  td.link a { display:block; padding:1px 5px; color:inherit; text-decoration:none; }
  td.id-cell div { display:flex; align-items:center; }
  td.id-cell a { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; direction:rtl; text-align:left; }
  td.id-cell a span { direction:ltr; unicode-bidi:isolate; }
  td.id-cell .cp { flex:none; }
  td.id-cell > div { max-width:var(--id-max, none); }
  td.var > span { max-width:var(--var-max, none); }
  td.var span { display:block; overflow:hidden; text-overflow:ellipsis; }
  .cp { all:unset; cursor:pointer; box-sizing:border-box; margin:0 3px; width:16px; height:14px; line-height:12px; text-align:center; font-size:11px; border:1px solid var(--grid); border-radius:3px; opacity:.55; }
  .cp:hover { opacity:1; background:rgba(128,128,128,.25); }
  td.link:hover { box-shadow:inset 0 0 0 100px rgba(0,0,0,.10); }
  td.id-cell:hover { box-shadow:none; }
  td.id-cell a:hover { box-shadow:inset 0 0 0 100px rgba(0,0,0,.10); }
  @media (prefers-color-scheme: dark) { td.link:hover, td.id-cell a:hover { box-shadow:inset 0 0 0 100px rgba(255,255,255,.14); } td.id-cell:hover { box-shadow:none; } }
  #tip { position:fixed; z-index:10; max-width:340px; padding:6px 8px; background:#111; color:#eee; border:1px solid #555; border-radius:3px; font-size:12px; line-height:1.3; white-space:pre-line; pointer-events:none; box-shadow:0 3px 10px rgba(0,0,0,.4); display:none; }
  th .short { display:none; }
  th.slim .full { display:none; }
  th.slim .short { display:inline; }
  th.slim .lbl { writing-mode:vertical-rl; transform:rotate(180deg); display:inline-block; }
  th.slim:not([data-k=country]) { text-align:center; padding:3px 2px; }
  th.slim .tg { display:block; margin:4px auto 0; width:fit-content; }
  th.bd { background:color-mix(in srgb, var(--accent) 22%, var(--head)); border-bottom-color:var(--accent); }
  .tg { display:inline-block; margin-left:5px; padding:0 6px; border:1px solid var(--accent); border-radius:9px; background:var(--accent); color:var(--bg); font-size:11px; font-weight:700; line-height:14px; vertical-align:1px; box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent), 0 1px 3px rgba(0,0,0,.35); }
  .tg:hover { filter:brightness(1.2); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent), 0 1px 4px rgba(0,0,0,.4); }
  .status a { color:var(--accent); }
  td.c, th.c { text-align:center; }
  .mute { color:var(--mute); }
  .status { padding:2px 8px; background:var(--head); border-top:4px solid var(--grid); color:var(--mute); font-size:11px; display:flex; flex-wrap:wrap; gap:0 14px; align-items:center; }
  .status label { color:var(--fg); cursor:pointer; white-space:nowrap; }
  .status input[type=number] { margin:0 2px; vertical-align:baseline; background:var(--bg); color:var(--fg); border:1px solid var(--grid); }
  .status input { margin:0 4px 0 0; vertical-align:-2px; }
  .status button { font:inherit; padding:0 8px; background:var(--bg); color:var(--fg); border:1px solid var(--grid); border-radius:3px; cursor:pointer; }
  .status button:hover { border-color:var(--accent); color:var(--accent); }
  dialog { max-width:520px; padding:16px 18px; background:var(--bg); color:var(--fg); border:1px solid var(--grid); border-radius:8px; font-size:13px; line-height:1.45; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog h2 { margin:0 0 8px; font-size:16px; }
  dialog p { margin:0 0 10px; }
  .dl-opts { display:grid; gap:6px; margin:12px 0; }
  .dl-opts button, #dl-close { font:inherit; text-align:left; padding:7px 10px; background:var(--head); color:var(--fg); border:1px solid var(--grid); border-radius:5px; cursor:pointer; }
  .dl-opts button:hover { border-color:var(--accent); }
  .dl-opts small { display:block; color:var(--mute); }
  #dl-msg { min-height:1.4em; color:var(--mute); }
</style>
</head>
<body>
<div class="wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<div id="tip"></div>
<div class="status">
  <label data-tip="Featured: only show models that are a top 2 pick for some RAM budget.&#10;For budgets from 0.5 GB upward, the 2 best models that fit in that much Q4 RAM are kept, ranked by composite score, Intelligence Index or GPQA. Everything else is hidden."><input type="checkbox" id="f-featured" checked>Featured</label>
  <label><input type="checkbox" id="f-scored" checked>Hide models with no scores</label>
    <label>Max RAM <input type="range" id="f-ram" min="0" max="1000" value="1000" style="width:220px;vertical-align:middle"> <b id="ram-val" style="display:inline-block;min-width:70px">no limit</b></label>
  <button id="dl-open" type="button">Download data</button>
  <span id="status">Loading…</span>
</div>
<dialog id="dl">
  <h2>Download this data</h2>
  <p>Every model, unfiltered, in a spreadsheet you can sort and rank however you like. The Score here is only a rough guide.</p>
  <p>XLSX and ODS keep the page's colors and header notes. Score and RAM are live formulas, so edit away.</p>
  <div class="dl-opts">
    <button type="button" data-fmt="xlsx"><b>XLSX</b> (Excel)<small>Most widely supported. Opens in Excel, Google Sheets and LibreOffice.</small></button>
    <button type="button" data-fmt="ods"><b>ODS</b> (OpenDocument)<small>The open standard. Opens in LibreOffice, and Excel and Google Sheets can import it.</small></button>
    <button type="button" data-fmt="csv"><b>CSV</b> (plain values)<small>No colors or formulas, just the numbers. Works in anything.</small></button>
  </div>
  <p id="dl-msg"></p>
  <button type="button" id="dl-close">Close</button>
</dialog>

<script>
const num = (d) => v => v == null ? '' : v.toFixed(d);
const clamp01 = t => Math.min(1, Math.max(0, t));
const log = (lo, hi) => v => clamp01((Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)));
const NOW = Date.now();
const SCORE_KEYS = ['aa_intel', 'aa_coding', 'aa_agentic', 'epoch_eci', 'epoch_gpqa', 'epoch_swe'];
const hasScore = m => SCORE_KEYS.some(k => m[k] != null);
const recent = v => clamp01(1 - (NOW - Date.parse(v)) / (365 * 864e5)); // today = 1, a year ago = 0
const CENTER = new Set(['country', 'version', 'composite', ...SCORE_KEYS, 'params_b', 'active_b', 'q4']);
const BREAKDOWN = new Set(SCORE_KEYS);
const SLIM = new Set(['composite', ...SCORE_KEYS, 'params_b', 'active_b', 'q4', 'context']); // headers turn sideways when the table runs out of room
let showBreakdown = false;
const COLS = [
  { k:'id',        label:'Hugging Face name', tip:"Full Hugging Face repo name (author/model), the 'big ugly name' chatbots use.\nClick to open the model page." },
  { k:'country',   label:'Country', tip:"Country of the lab that released the model.\nClick to sort." },
  { k:'org',       label:'Org', tip:"Organization that released the weights (Hugging Face author)." },
  { k:'product',   label:'Product', tip:"Model family, parsed from the Hugging Face model name.\nClick a cell to open the model page on Hugging Face." },
  { k:'version',   label:'Ver', hue:'new', scale:(v, m) => m.ver_t, tip:"Version number parsed from the name.\nShading: newest version in its family is strongest, then the previous two fainter." },
  { k:'variant',   label:'Variant', tip:"Everything else in the name: size tag, Instruct, Base, Thinking, Coder, etc." },
  { k:'composite', label:'Score',      n:1, hue:'score', scale:v => clamp01((v - 15) / 80), fmt:num(0), tip:"Composite of all available intelligence scores.\nEach score (Intel, Coding, Agentic, ECI, GPQA, SWE-V) is turned into a percentile rank among all models that have it, then the ranks are averaged over whichever scores a model has. 0-100; 50 = typical scored model.\nA rough guide, not gospel: a model with one score can outrank one with several. Use Download data (footer) to build your own ranking." },
  { k:'aa_intel',  label:'Intel',      n:1, hue:'score', scale:v => clamp01((v - 5) / 60), fmt:num(0), tip:"Artificial Analysis Intelligence Index.\nComposite of many evals, roughly 0-70 for current models. Higher is better.\nOnly models Artificial Analysis lists and we could match by name." },
  { k:'aa_coding', label:'Coding',     n:1, hue:'score', scale:v => clamp01((v - 5) / 60), fmt:num(0), tip:"Artificial Analysis Coding Index.\nComposite of coding evals (e.g. Terminal-Bench, SciCode). Higher is better." },
  { k:'aa_agentic',label:'Agentic',    n:1, hue:'score', scale:v => clamp01((v - 5) / 60), fmt:num(0), tip:"Artificial Analysis Agentic Index.\nComposite of agentic tool-use evals. Higher is better." },
  { k:'epoch_eci', label:'ECI',        n:1, hue:'score', scale:v => clamp01((v - 110) / 55), fmt:num(0), tip:"Epoch Capabilities Index (Epoch AI).\nOne number combining many benchmarks onto a common scale; ~110-165 here. Higher is better." },
  { k:'epoch_gpqa',label:'GPQA',       n:1, hue:'score', scale:v => clamp01((v - 30) / 65), fmt:num(0), tip:"GPQA Diamond accuracy, % (Epoch AI runs).\nGraduate-level science multiple choice; random guessing is 25%." },
  { k:'epoch_swe', label:'SWE-V',      n:1, hue:'score', scale:v => clamp01((v - 20) / 70), fmt:num(0), tip:"SWE-bench Verified, % solved (Epoch AI runs).\nA test of real-world software engineering: the model gets an actual bug report from a popular open-source Python project and must edit the code to fix it. A fix counts only if the project's own tests then pass. 'Verified' = 500 tasks that humans checked are solvable.\nScores depend a lot on the agent scaffold around the model, so compare with care." },
  { k:'params_b',  label:'Params B',   n:1, hue:'size', scale:log(0.1, 1000), fmt:v => v < 10 ? v.toFixed(2) : v.toFixed(1), tip:"Total parameters, in billions.\nFrom Hugging Face safetensors metadata, or the size in the model name.\nFor MoE models this is all experts, which is what must fit in memory." },
  { k:'active_b',  label:'Active B',   n:1, hue:'size', scale:log(0.1, 1000), fmt:v => v == null ? '' : v, tip:"Parameters used per token, in billions. This drives speed.\nMoE models: only the active experts, parsed from names like A3B. Dense models: same as Params B, so you can sort MoE and dense models side by side.\nIf a MoE model does not state its active size in its name, it shows its total here.\nMemory still needs ALL params (see RAM), unless you offload experts to CPU." },
  { k:'q4',        label:'RAM GB (Q4)',      n:1, hue:'size', scale:log(0.1, 1000), fmt:num(1), tip:"Approximate memory to run the model at 4-bit quantization (Q4_K_M), the most common choice for local use: params x ~0.57 bytes.\nWeights only; add KV cache and overhead (10-30%+). Q8 needs about 1.75x this, FP16 about 3.5x." },
  { k:'context',   label:'Context',    n:1, hue:'size', scale:log(4096, 1048576), fmt:v => v == null ? '' : (v >= 1024 ? Math.round(v / 1024) + 'K' : v), tip:"Maximum context window in tokens, from OpenRouter.\nBlank = not listed there. KV cache for long contexts adds a lot of memory." },
  { k:'downloads', label:'Downloads',  n:1, hue:'pop', scale:log(1e3, 3e7), fmt:v => v.toLocaleString(), tip:"Hugging Face downloads over the last 30 days.\nColor is log-scaled." },
  { k:'likes',     label:'Likes',      n:1, hue:'pop', scale:log(10, 5000), fmt:v => v.toLocaleString(), tip:"Hugging Face likes (all time)." },
  { k:'created',   label:'Created',    hue:'new', scale:recent, tip:"Date the repo was created on Hugging Face.\nGreener = more recent (fades to none over a year)." },
  { k:'updated',   label:'Updated',    hue:'new', scale:recent, tip:"Date of the last commit to the repo on Hugging Face.\nGreener = more recent." },
];
const DEFAULT_SORT = [['composite',-1],['country',1],['org',1],['product',1],['version',-1],['params_b',-1]];
const tint = (c, pct) => c ? `background:color-mix(in srgb, ${c} ${pct}%, transparent)` : '';
// Boring values (low t) get no color; only the high end gets noticeable.
const heat = (hue, t) => t < 0.12 ? '' : `background:rgba(var(--${hue}), ${(0.05 + 0.5 * t * t).toFixed(2)})`;

// Rank each version within its own org + product line (and letter prefix, so DeepSeek V and R series don't compete).
function addVersionRank(list) {
  const parse = v => { const m = String(v).match(/^([a-z]?)(\d+(?:\.\d+)*)$/i); return m && { p:m[1].toLowerCase(), n:m[2].split('.').map(Number) }; };
  const diff = (a, b) => { for (let i = 0; i < Math.max(a.length, b.length); i++) { const d = (a[i] || 0) - (b[i] || 0); if (d) return d; } return 0; };
  const groups = {};
  for (const m of list) {
    const p = m.version && parse(m.version);
    if (!p) continue;
    (groups[m.org + '|' + m.product + '|' + p.p] ||= new Map()).set(m.version, p.n);
  }
  for (const g of Object.keys(groups)) {
    const order = [...groups[g].entries()].sort((a, b) => diff(b[1], a[1])).map(e => e[0]);
    groups[g] = order;
  }
  const T = [1, 0.5, 0.25];
  for (const m of list) {
    const p = m.version && parse(m.version);
    m.ver_t = p ? (T[groups[m.org + '|' + m.product + '|' + p.p].indexOf(m.version)] || 0) : 0;
  }
}

let info = '', generated = '', models = [], orgs = {}, countries = {}, sort = [['composite', -1]];
const $ = id => document.getElementById(id);

// Percentile rank per score column across all models, averaged over the scores a model has.
function addComposite(list) {
  const ranks = SCORE_KEYS.map(k => {
    const vals = list.map(m => m[k]).filter(v => v != null).sort((a, b) => a - b);
    return v => { let lo = 0, hi = vals.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (vals[mid] < v) lo = mid + 1; else hi = mid; } let e = lo; while (e < vals.length && vals[e] === v) e++; return 100 * ((lo + e) / 2) / vals.length; };
  });
  for (const m of list) {
    const r = SCORE_KEYS.map((k, i) => m[k] != null ? ranks[i](m[k]) : null).filter(x => x != null);
    m.composite = r.length ? r.reduce((a, b) => a + b, 0) / r.length : null;
  }
}

// Variant glossary: generic tokens, plus family-specific ones keyed "product:token" (lowercase). Unknown tokens just don't get a line.
const GLOSS = {
  it: 'Instruction-tuned: trained to follow instructions and chat. This is the one you want for a chatbot or assistant.',
  instruct: 'Instruction-tuned: trained to follow instructions and chat. This is the one you want for a chatbot or assistant.',
  instruction: 'Instruction-tuned: trained to follow instructions and chat.',
  chat: 'Fine-tuned for conversation.',
  sft: 'Supervised fine-tuning: trained on example conversations or answers.',
  dpo: 'Direct Preference Optimization: tuned on pairs of better/worse answers to match human preferences.',
  rl: 'Trained with reinforcement learning (rewarded for good outcomes), often for reasoning.',
  grpo: 'Trained with GRPO, a reinforcement-learning method used to teach reasoning.',
  base: 'Base model: raw pretrained weights that only continue text. Not a chatbot. Mainly for fine-tuning or research.',
  pt: 'Pretrained base model: raw weights that only continue text. Not a chatbot; use the instruct/it version to chat.',
  pretrain: 'Pretrained base model: raw weights that only continue text.',
  thinking: 'Reasoning model: writes out a long chain of thought before answering. Smarter on hard problems, slower, uses many more tokens.',
  think: 'Reasoning model: writes out a long chain of thought before answering.',
  reasoning: 'Reasoning model: writes out a long chain of thought before answering.',
  vl: 'Vision-language: can take images (and sometimes video) as well as text.',
  vlm: 'Vision-language: can take images as well as text.',
  vision: 'Can take images as input as well as text.',
  omni: 'Multimodal: handles text plus images, audio and/or video.',
  ocr: 'Specialized for reading text out of images and documents.',
  audio: 'Handles audio input/output.',
  video: 'Handles video input.',
  coder: 'Specialized for writing code.',
  code: 'Specialized for writing code.',
  math: 'Specialized for math problems.',
  prover: 'Specialized for formal theorem proving.',
  moe: 'Mixture of experts: only some of the parameters are used per token (see Active B).',
  distill: 'Distilled: a smaller model trained to imitate a bigger one.',
  guard: 'Safety/moderation classifier, not a general chat model.',
  guardian: 'Safety/moderation classifier, not a general chat model.',
  qat: 'Quantization-aware training: trained so that 4-bit quantizing it loses less quality.',
  preview: 'Early preview release; may change or be unfinished.',
  exp: 'Experimental release.',
  hf: 'Converted to Hugging Face Transformers format (same model, different file layout).',
  deduped: 'Trained on a de-duplicated copy of the training data (the Pythia models come in normal and deduped versions).',
  tiny: 'Smallest size tier of this family.',
  nano: 'Very small size tier of this family.',
  mini: 'Small size tier of this family.',
  lite: 'Lightweight size tier of this family.',
  small: 'Small size tier of this family.',
  flash: 'Fast, cheaper size tier of this family, usually a mid-sized mixture of experts.',
  plus: 'Larger size tier of this family.',
  pro: 'Larger, more capable tier of this family.',
  large: 'Large size tier of this family.',
  'gemma:e2b': 'Effective 2B: about 2B parameters of compute per token, but extra per-layer embedding tables make the file bigger (around 5B total). Built to run on phones and laptops.',
  'gemma:e4b': 'Effective 4B: about 4.5B parameters of compute per token, but per-layer embedding tables bring the total to around 8B. The table lookups are cheap, so it runs like a 4B model but needs more memory.',
  'gemma:it': 'Instruction-tuned: the chat/assistant version of Gemma. (The raw base version is labeled pt, "pretrained".)',
  'gemma:assistant': 'Assistant-oriented variant of the instruction-tuned model.',
  'falcon:h1': 'Falcon-H1: hybrid architecture mixing Transformer attention with Mamba state-space layers, for long contexts at lower memory and compute cost.',
  'falcon:h1r': 'Falcon-H1R: the reasoning version of Falcon-H1 (7B). Hybrid Transformer + Mamba, trained to think step by step; TII claims it matches much larger reasoning models on math and coding.',
  'falcon:r': 'R = reasoning variant (trained to think step by step).',
  'falcon:mamba': 'Pure Mamba (state-space) model with no attention layers: memory use does not grow with context length.',
  'falcon:e': 'Falcon-Edge: very low-bit (ternary, ~1.58-bit) weights made for tiny devices.',
  'falcon:deep': 'Deeper (more layers) version at the same parameter count.',
  'falcon:rw': 'RefinedWeb: older Falcon trained only on filtered web data.',
  'ling:tiny': 'Ling Tiny: Ant Group’s small mixture-of-experts model, about 8B total with ~1.3B active per token. Fast on modest hardware.',
  'ling:flash': 'Ling Flash: Ant Group’s speed-focused mixture of experts, about 124B total with ~5B active per token (Ling 3.0).',
  'ling:mini': 'Ling Mini: small mixture-of-experts tier of the Ling family.',
  'ling:lite': 'Ling Lite: lightweight mixture-of-experts tier of the Ling family.',
  'ling:plus': 'Ling Plus: larger mixture-of-experts tier of the Ling family.',
  'ling:1t': 'Trillion-parameter flagship mixture of experts of the Ling family.'
};
const variantTip = (m) => {
  const seen = new Set(), lines = [];
  for (const t of String(m.variant || '').split(/\s+/).filter(Boolean)) {
    const k = t.toLowerCase();
    const g = GLOSS[String(m.product).toLowerCase() + ':' + k] || GLOSS[k] || (/^\d{4}$/.test(k) ? 'Date-like code, probably the release month/day (e.g. 0414 = April 14).' : /^\d+(\.\d+)?[tbm]$/.test(k) ? null : null);
    if (g && !seen.has(g)) { seen.add(g); lines.push(t + ': ' + g); }
  }
  return lines.join('\n');
};

// Log-scale slider: 1 GB .. largest model; the far right means no limit.
const ramLimit = () => { const p = +$('f-ram').value; return p >= 1000 ? null : Math.pow(ramMax, p / 1000); };
let ramMax = 1000;

function cmp(a, b, k, dir) {
  const x = a[k], y = b[k];
  if (x == null || x === '') return y == null || y === '' ? 0 : 1;
  if (y == null || y === '') return -1;
  const r = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), undefined, { numeric:true, sensitivity:'base' });
  return r * dir;
}

// Featured: the top 2 by composite, Intel or GPQA among the models that fit each RAM budget (fine steps at the small end, ~10% steps above 16 GB).
let featuredIds = null;
function featuredSet() {
  if (featuredIds) return featuredIds;
  featuredIds = new Set();
  const budgets = [0.5, 1, 2, 3, 4, 5, 6, 8, 10, 12, 14, 16];
  for (let b = 16 * 1.1; b < ramMax * 1.1; b *= 1.1) budgets.push(b);
  for (const b of budgets) {
    const fit = models.filter(m => m.q4 <= b);
    for (const k of ['composite', 'aa_intel', 'epoch_gpqa'])
      fit.filter(m => typeof m[k] === 'number').sort((x, y) => y[k] - x[k]).slice(0, 2).forEach(m => featuredIds.add(m.id));
  }
  return featuredIds;
}

function render() {
  const keys = [...sort, ...DEFAULT_SORT];
  const hideUnscored = $('f-scored').checked;
  const maxRam = ramLimit();
  const featured = $('f-featured').checked ? featuredSet() : null;
  const rows = models.filter(m => (!featured || featured.has(m.id)) && (!hideUnscored || hasScore(m)) && (maxRam == null || m.q4 <= maxRam)).sort((a, b) => {
    for (const [k, d] of keys) { const r = cmp(a, b, k, d); if (r) return r; }
    return 0;
  });
  $('ram-val').textContent = maxRam == null ? 'no limit' : (maxRam < 10 ? maxRam.toFixed(1) : Math.round(maxRam)) + ' GB';
  $('status').innerHTML = `${rows.length} of ${models.length} models · ${info}`;
  const sk = sort[0] && sort[0][0], sd = sort[0] && sort[0][1];
  const cols = COLS.filter(c => showBreakdown || !BREAKDOWN.has(c.k));
  $('head').innerHTML = cols.map(c =>
    `<th data-k="${c.k}" class="${c.n ? 'n' : ''} ${CENTER.has(c.k) ? 'c' : ''} ${c.k === sk ? 'sorted' : ''} ${BREAKDOWN.has(c.k) ? 'bd' : ''}" data-tip="${(c.tip || '').replace(/"/g, '&quot;')}">${c.k === 'country' ? '<span class="full">Country</span><span class="short">Ctry</span>' : SLIM.has(c.k) ? `<span class="lbl">${c.label}${c.k === sk ? (sd > 0 ? ' ▲' : ' ▼') : ''}</span>` : c.label}${SLIM.has(c.k) || c.k === 'country' ? '' : c.k === sk ? (sd > 0 ? ' ▲' : ' ▼') : ''}${c.k === 'composite' ? `<span class="tg" data-tip="${showBreakdown ? 'Hide' : 'Show'} the individual scores behind this one">${showBreakdown ? '◂' : '▸'}</span>` : ''}</th>`).join('');
  $('body').innerHTML = rows.map(m => '<tr>' + cols.map(c => {
    const v = m[c.k];
    let style = '', html;
    if (c.k === 'id') { style = tint(orgs[m.org], 16); html = `<div><a href="https://huggingface.co/${m.id}" target="_blank" rel="noopener"><span>${m.id}</span></a><button class="cp" data-copy="${m.id}" data-tip="Copy &quot;${m.id}&quot; to the clipboard">⧉</button></div>`; }
    else if (c.k === 'country') { style = tint(countries[m.country]?.color, 16); html = `<span data-tip="${countries[m.country]?.name || ''}">${m.country}</span>`; }
    else if (c.k === 'org') { style = tint(orgs[m.org], 16); html = m.org; }
    else if (c.k === 'product') { style = tint(orgs[m.org], 16); html = `<a href="https://huggingface.co/${m.id}" target="_blank" rel="noopener">${m.product}</a>`; }
    else if (c.k === 'variant') html = `<span>${v ?? ''}</span>`;
    else { html = c.fmt ? (v == null ? '' : c.fmt(v)) : (v ?? ''); if (c.hue && v != null && v !== '') style = heat(c.hue, c.scale(v, m)); }
    const tip = c.k === 'variant' ? variantTip(m).replace(/"/g, '&quot;') : '';
    return `<td class="${c.n ? 'n' : ''}${CENTER.has(c.k) ? ' c' : ''}${c.k === 'variant' ? ' var' : ''}${c.k === 'product' ? ' link' : c.k === 'id' ? ' link id-cell' : ''}" style="${style}"${tip ? ` data-tip="${tip}"` : ''}>${html}</td>`;
  }).join('') + '</tr>').join('');
  fitColumns();
  try { localStorage.setItem('om-prefs', JSON.stringify({ featured: $('f-featured').checked, hideUnscored, ram: +$('f-ram').value, showBreakdown, sort })); } catch (_) {}
  document.querySelectorAll('th[data-k]').forEach(th => th.onclick = e => {
    if (e.target.classList.contains('tg')) { showBreakdown = !showBreakdown; tipEl.style.display = 'none'; render(); return; }
    const k = th.dataset.k;
    const first = COLS.find(c => c.k === k).n ? -1 : 1;
    sort = [[k, sk === k ? -sd : first]];
    render();
  });
}

// Slim the Hugging Face name (chopped on the left) and Variant (chopped on the right) before the table overflows, down to a minimum width each.
const MIN_W = { id: 170, variant: 90 };
let fitCache = null, fitStage = -1;
function fitColumns(remeasure = true) {
  const wrap = document.querySelector('.wrap'), table = wrap.querySelector('table');
  const heads = [...table.querySelectorAll('th')];
  const idx = {};
  heads.forEach((th, i) => { if (MIN_W[th.dataset.k]) idx[th.dataset.k] = i; });
  const vars = { id: '--id-max', variant: '--var-max' };
  const set = (k, px) => { if (px == null) table.style.removeProperty(vars[k]); else table.style.setProperty(vars[k], px + 'px'); };
  // Slimming order: the name and Variant columns first, then headers go sideways in stages (Country, the score flyout, the rest).
  const stages = [['country'], SCORE_KEYS, [...SLIM]];
  const apply = s => {
    heads.forEach(th => th.classList.toggle('slim', s > 0 && stages.slice(0, s).some(st => st.includes(th.dataset.k))));
    fitStage = s;
  };
  // Natural widths per stage don't depend on the window, so measure them once per render and reuse them while resizing.
  if (remeasure || !fitCache) {
    fitCache = [];
    for (const k in vars) set(k, null);
    for (let s = 0; s <= stages.length; s++) {
      apply(s);
      const w = {};
      for (const k in idx) w[k] = heads[idx[k]].getBoundingClientRect().width;
      fitCache.push({ table: table.getBoundingClientRect().width, w });
    }
  }
  // Pick the fewest sideways stages that let the name/Variant columns absorb the overflow, so no space is left unused.
  const avail = wrap.clientWidth;
  let s = 0;
  for (; s < fitCache.length - 1; s++) {
    const c = fitCache[s];
    if (c.table - avail <= Object.keys(idx).reduce((t, k) => t + c.w[k] - MIN_W[k], 0)) break;
  }
  if (s !== fitStage || remeasure) apply(s);
  const { table: tw, w } = fitCache[s];
  let over = tw - avail;
  for (const k of ['id', 'variant']) {
    if (!(k in idx)) continue;
    const cut = Math.max(0, Math.min(over + 2, w[k] - MIN_W[k]));
    if (cut > 0) { set(k, w[k] - cut - (k === 'id' ? 0 : 11)); over -= cut; } else set(k, null);
  }
  table.querySelectorAll('td.id-cell a').forEach(a => { a.dataset.tip = a.scrollWidth > a.clientWidth ? a.textContent : ''; });
}
let fitQueued = false;
window.addEventListener('resize', () => {
  if (fitQueued) return;
  fitQueued = true;
  requestAnimationFrame(() => { fitQueued = false; fitColumns(false); });
});

const tipEl = $('tip');
document.addEventListener('click', e => {
  const b = e.target.closest('.cp');
  if (!b) return;
  const done = () => { tipEl.textContent = 'Copied!'; };
  const legacy = () => { const t = document.createElement('textarea'); t.value = b.dataset.copy; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (_) {} t.remove(); };
  (navigator.clipboard ? navigator.clipboard.writeText(b.dataset.copy).then(done, legacy) : Promise.resolve(legacy()));
});
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (!t || !t.dataset.tip) { tipEl.style.display = 'none'; return; }
  tipEl.textContent = t.dataset.tip;
  tipEl.style.display = 'block';
  const r = t.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(4, Math.min(r.left, innerWidth - w - 4)) + 'px';
  tipEl.style.top = (r.bottom + h + 6 > innerHeight ? r.top - h - 4 : r.bottom + 4) + 'px';
});
document.addEventListener('mouseleave', () => tipEl.style.display = 'none');

const loaded = {};
const loadScript = src => loaded[src] || (loaded[src] = new Promise((ok, fail) => {
  const el = document.createElement('script');
  el.src = src;
  el.onload = ok;
  el.onerror = () => { delete loaded[src]; fail(new Error('could not load ' + src)); };
  document.head.appendChild(el);
}));
const DL_LIBS = { xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js', ods: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js' };
const DL_MIME = { xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', ods: 'application/vnd.oasis.opendocument.spreadsheet', csv: 'text/csv;charset=utf-8' };
$('dl-open').onclick = () => { $('dl-msg').textContent = ''; $('dl').showModal(); };
$('dl-close').onclick = () => $('dl').close();
$('dl').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
document.querySelectorAll('#dl [data-fmt]').forEach(b => b.onclick = async () => {
  const fmt = b.dataset.fmt, msg = $('dl-msg');
  msg.textContent = 'Building the file…';
  try {
    await loadScript('export.js');
    if (DL_LIBS[fmt]) await loadScript(DL_LIBS[fmt]);
    const t = new Date(), p = n => String(n).padStart(2, '0');
    const stamp = `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}_${p(t.getHours())}${p(t.getMinutes())}${p(t.getSeconds())}`;
    const all = [...models].sort((a, b) => { for (const [k, d] of DEFAULT_SORT) { const r = cmp(a, b, k, d); if (r) return r; } return 0; });
    OMExport.download(`open-models_${stamp}.${fmt}`, await OMExport[fmt]({ models: all, cols: COLS, orgs, countries, generated, now: NOW }), DL_MIME[fmt]);
    msg.textContent = `Downloaded open-models_${stamp}.${fmt}`;
  } catch (e) { msg.textContent = 'Sorry, that did not work (' + e.message + ').'; }
});

Promise.all([fetch('data/models.json', {cache:'no-cache'}).then(r => r.json()), fetch('data/orgs.json', {cache:'no-cache'}).then(r => r.json())]).then(([d, o]) => {
  countries = o.countries;
  for (const v of Object.values(o.orgs)) orgs[v.org] = v.color;
  models = d.models.map(m => ({ ...m, version: m.version && m.version.replace(/^v(?=\d)/i, ''), active_b: m.active_b ?? m.params_b, fp16: m.params_b * 2, q8: m.params_b, q4: m.params_b * 0.57 }));
  generated = d.generated.slice(0, 10);
  info = `updated ${generated} · scores: <a href="https://artificialanalysis.ai" target="_blank" rel="noopener">Artificial Analysis</a>, <a href="https://epoch.ai" target="_blank" rel="noopener">Epoch AI</a> (CC BY) · data: Hugging Face, OpenRouter · Made by <a href="https://jesse-hufstetler.github.io/">Jesse Hufstetler</a>, mostly for himself to use and goof around with`;
  $('f-scored').addEventListener('change', render);
  $('f-featured').addEventListener('change', render);
  ramMax = Math.max(...models.map(m => m.q4));
  $('f-ram').value = Math.round(1000 * Math.log(16) / Math.log(ramMax)); // default limit: 16 GB
  try {
    const p = JSON.parse(localStorage.getItem('om-prefs') || 'null');
    if (p) {
      if (typeof p.featured === 'boolean') $('f-featured').checked = p.featured;
      if (typeof p.hideUnscored === 'boolean') $('f-scored').checked = p.hideUnscored;
      if (Number.isFinite(p.ram)) $('f-ram').value = Math.min(1000, Math.max(0, p.ram));
      if (typeof p.showBreakdown === 'boolean') showBreakdown = p.showBreakdown;
      if (Array.isArray(p.sort) && p.sort.length && p.sort.every(x => COLS.some(c => c.k === x[0]) && (x[1] === 1 || x[1] === -1))) sort = p.sort;
    }
  } catch (_) {}
  $('f-ram').addEventListener('input', render);
  $('f-ram').addEventListener('wheel', e => { e.preventDefault(); const r = e.currentTarget; r.value = Math.min(1000, Math.max(0, +r.value - Math.sign(e.deltaY) * 10)); render(); }, { passive:false });
  addVersionRank(models);
  addComposite(models);
  render();
}).catch(() => { $('status').textContent = 'Could not load data'; });
</script>
</body>
</html>
