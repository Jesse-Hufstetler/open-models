name: Update model data

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download Epoch benchmark data
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/epoch.zip https://epoch.ai/data/benchmark_data.zip
          unzip -q /tmp/epoch.zip -d /tmp/epoch
      - run: node scripts/build-models.js
        continue-on-error: true
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          EPOCH_DIR: /tmp/epoch
      - name: Commit if changed
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add data/
            git commit -m "data: update models.json"
            git push
          fi
